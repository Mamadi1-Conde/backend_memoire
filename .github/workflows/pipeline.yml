name: Backend CI CD 
 
on: 
  push: 
    branches: [main, develop] 
  pull_request: 
    branches: [main] 
 
jobs: 
  ci: 
    runs-on: ubuntu-latest 
    steps: 
      - uses: actions/checkout@v4 
      - uses: actions/setup-java@v4 
        with: 
          distribution: temurin 
          java-version: '21' 
          cache: maven 
      - name: Compiler et tester 
        run: mvn -B clean verify 
